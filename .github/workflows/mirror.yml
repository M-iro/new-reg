name: Mirror Kiali Image
on:
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull from quay.io
        run: docker pull quay.io/kiali/kiali:v2.20.0
      - name: Tag for GHCR
        run: docker tag quay.io/kiali/kiali:v2.20.0 ghcr.io/${{ github.repository_owner }}/kiali:v2.20.0
      - name: Push to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/kiali:v2.20.0
