name: Mirror images to ghcr.io

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source image (e.g. quay.io/argoproj/argocd:v3.5.1)'
        required: true
      dest_name:
        description: 'Destination image name (e.g. argocd)'
        required: true
      dest_tag:
        description: 'Destination tag (e.g. v3.5.1)'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Copy image
        run: |
          skopeo copy --all \
            docker://${{ github.event.inputs.source_image }} \
            docker://ghcr.io/${{ github.actor }}/${{ github.event.inputs.dest_name }}:${{ github.event.inputs.dest_tag }}
