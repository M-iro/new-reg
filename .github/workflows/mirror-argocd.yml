name: Mirror ArgoCD Image
on:
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull from quay.io
        run: docker pull quay.io/argoproj/argocd:v3.5.1
      - name: Tag for GHCR
        run: docker tag quay.io/argoproj/argocd:v3.5.1 ghcr.io/${{ env.OWNER_LC }}/argocd:v3.5.1
      - name: Push to GHCR
        run: docker push ghcr.io/${{ env.OWNER_LC }}/argocd:v3.5.1
